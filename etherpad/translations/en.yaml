---
configuration:
  title:
    name: Instance Title
    description: >-
      Name shown in the Etherpad browser tab and in Open Graph / share
      previews. Free-form text.
  require_authentication:
    name: Require Authentication
    description: >-
      When enabled, every pad and the home page demand a username and
      password before opening. Leave off for a friction-free private
      instance behind your LAN.
  admin_password:
    name: Admin Password
    description: >-
      Password for the built-in `admin` account that can manage plugins
      and inspect every pad at `/admin`. Stored in plaintext in the
      supervisor's options database — leave blank to disable admin
      access entirely.
  user_password:
    name: User Password
    description: >-
      Password for the built-in `user` account (read/write access to
      pads). Optional; ignored when authentication is disabled.
  default_pad_text:
    name: Default Pad Text
    description: >-
      Content inserted into every newly-created pad. Useful for a
      welcome message or template instructions.
  db_type:
    name: Database Backend
    description: >-
      Where pad content is persisted. `sqlite` (default) stores pads
      in `/data/etherpad.db` — ACID and ideal for single-instance use.
      `dirty` is dev-only and not recommended. `mysql` and `postgres`
      connect to an external database you operate yourself.
  db_host:
    name: Database Host
    description: >-
      Hostname or IP of the external MySQL/PostgreSQL server. Leave
      blank for sqlite or dirty.
  db_port:
    name: Database Port
    description: >-
      TCP port for the external database. Typically 3306 for MySQL,
      5432 for PostgreSQL.
  db_name:
    name: Database Name
    description: >-
      Database name on the external server. Etherpad will create its
      tables on first run.
  db_user:
    name: Database User
    description: >-
      Username for the external database. Needs CREATE TABLE
      privileges on first run, then only SELECT / INSERT / UPDATE.
  db_password:
    name: Database Password
    description: >-
      Password for the external database user.
  trust_proxy:
    name: Trust X-Forwarded Headers
    description: >-
      Tell Etherpad to honour `X-Forwarded-For` and `X-Forwarded-Proto`
      from upstream proxies. Keep ON for ingress and reverse-proxy
      setups (which is the typical HA path).
  log_level:
    name: Log Level
    description: >-
      Verbosity of Etherpad's server log shown in the Log tab.
  ssl:
    name: Enable Direct HTTPS
    description: >-
      When enabled, Etherpad listens HTTPS directly on port 9001 using
      the certificate and key files referenced below from HA's
      `/ssl/` folder. Leave off if you terminate TLS in front of the
      add-on (HA ingress, Nginx, Cloudflare, etc.).
  certfile:
    name: Certificate File
    description: >-
      Name of the certificate file inside HA's `/ssl/` directory.
      `fullchain.pem` is the standard layout produced by the
      `core_letsencrypt` add-on. Only used when "Enable Direct HTTPS"
      is on.
  keyfile:
    name: Private Key File
    description: >-
      Name of the private-key file inside HA's `/ssl/` directory.
      `privkey.pem` is the standard layout. Only used when "Enable
      Direct HTTPS" is on.
network:
  9001/tcp: Etherpad web port (direct LAN/WAN access, bypasses ingress)
