name: Etherpad
version: "3.1.20"
slug: etherpad
description: Realtime collaborative document editor
url: https://etherpad.org
init: false
arch:
  - aarch64
  - amd64
ingress: true
ingress_port: 9002
ingress_stream: true
panel_icon: mdi:file-document-edit-outline
panel_title: Etherpad
ports:
  "9001/tcp": 9001
ports_description:
  "9001/tcp": Etherpad web UI (direct access, bypasses ingress)
map:
  - addon_config:rw
  - share:rw
  - ssl
options:
  title: Etherpad
  default_pad_text: |
    Welcome to Etherpad!

    This pad text is synchronized as you type, so that everyone viewing this
    page sees the same text. This allows you to collaborate seamlessly on
    documents!
  log_level: INFO
  plugins: []
  admin_password: ""
  require_authentication: false
  user_password: ""
  db_type: sqlite
  trust_proxy: true
  ssl: false
  certfile: fullchain.pem
  keyfile: privkey.pem
schema:
  title: str
  default_pad_text: str
  log_level: list(DEBUG|INFO|WARN|ERROR)
  plugins:
    - str
  admin_password: password
  require_authentication: bool
  user_password: password
  db_type: list(dirty|mysql|postgres|sqlite)
  db_host: str?
  db_port: port?
  db_name: str?
  db_user: str?
  db_password: password?
  trust_proxy: bool
  ssl: bool
  certfile: str
  keyfile: str
image: ghcr.io/ether/home-assistant-addon-etherpad-{arch}
