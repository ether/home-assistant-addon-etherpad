name: Bug report
description: Something's broken in the Etherpad add-on for Home Assistant
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please fill in as much as you can — vague
        reports get fixed slowly. For upstream Etherpad bugs (the editor
        itself, plugins, etc.), please open at
        <https://github.com/ether/etherpad/issues> instead.
  - type: input
    id: addon-version
    attributes:
      label: Add-on version
      description: From the addon's Info tab, e.g. 3.1.6
    validations:
      required: true
  - type: input
    id: ha-version
    attributes:
      label: Home Assistant Core + Supervisor versions
      description: e.g. Core 2026.5.3 / Supervisor 2026.05.2
    validations:
      required: true
  - type: dropdown
    id: arch
    attributes:
      label: Architecture
      options:
        - amd64
        - aarch64
    validations:
      required: true
  - type: textarea
    id: behaviour
    attributes:
      label: What did you expect to happen, and what actually happened?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Install the add-on
        2. Set ssl: true
        3. Click Save
        4. ...
  - type: textarea
    id: logs
    attributes:
      label: Add-on log (last ~40 lines)
      render: shell
    validations:
      required: true
