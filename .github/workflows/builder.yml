name: Builder

on:
  push:
    branches:
      - main
    paths:
      - "etherpad/**"
      - ".github/workflows/builder.yml"
    tags:
      - "v?[0-9]+.[0-9]+.[0-9]+"
  pull_request:
    paths:
      - "etherpad/**"
      - ".github/workflows/builder.yml"

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  lint:
    name: Lint add-on config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run hassio-addon-lint
        uses: frenck/action-addon-linter@v2
        with:
          path: "./etherpad"

  build:
    name: Build ${{ matrix.arch }}
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            os: ubuntu-24.04
            base: ghcr.io/home-assistant/amd64-base:latest
          - arch: aarch64
            os: ubuntu-24.04-arm
            base: ghcr.io/home-assistant/aarch64-base:latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Read add-on version
        id: manifest
        run: |
          version=$(grep -m1 '^version:' etherpad/config.yaml | sed 's/version: *"\?\([^"]*\)"\?/\1/')
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Build & push image
        uses: home-assistant/builder/actions/build-image@2026.03.2
        with:
          arch: ${{ matrix.arch }}
          context: ./etherpad
          image: ghcr.io/${{ github.repository_owner }}/home-assistant-addon-etherpad-${{ matrix.arch }}
          image-tags: |
            ${{ steps.manifest.outputs.version }}
            latest
          push: ${{ github.event_name != 'pull_request' }}
          version: ${{ steps.manifest.outputs.version }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          build-args: |
            BUILD_FROM=${{ matrix.base }}
          cosign: "false"
